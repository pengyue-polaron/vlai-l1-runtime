name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-free:
    name: Hardware-free / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install hardware-free development environment
        run: uv sync --frozen --dev

      - name: Test VLAI Runtime
        run: uv run pytest

      - name: Test embodied-ops
        run: uv run pytest external/embodied-ops/tests

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
