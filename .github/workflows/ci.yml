name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-safety:
    name: Hardware-free native safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure native safety tests without the vendor SDK
        run: cmake -S native/xair_sidecar -B build/native-safety -DVLAI_L1_SAFETY_ONLY=ON
      - name: Build native safety tests
        run: cmake --build build/native-safety --parallel
      - name: Run native safety tests
        run: ctest --test-dir build/native-safety --output-on-failure

  hardware-free:
    name: Hardware-free / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository and pinned dependencies
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install hardware-free development environment
        run: uv sync --frozen --dev

      - name: Test VLAI Runtime
        run: uv run pytest

      - name: Test embodied-ops
        run: uv run pytest external/embodied-ops/tests

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
